interface:
  display_name: "英语实战讲评 Skill"
  short_description: "提供试卷、答案和听力，生成含逐题讲解、音频分段与答案溯源的教师课件，Windows 与手机同样可用"
  default_prompt: "使用 $english-exam-studio，根据我提供的试卷、参考答案与听力音频，先运行 scripts/doctor.py 判断本机可用的听力接入档位，再按 references/source-verification.md 核对原件与音频，用本包固定模板和 scripts/build.py 生成完整的教师 HTML 讲评课件；听力必须真正接入并在页面写明是完整分段、静音分段还是整卷原音，答案用 scripts/answers.py 从答案原件解析后与台账、exam.json 逐题比对，最后运行 scripts/verify_output.py 验证模板一致性，保留原文、题型方法、证据定位、精选词句和写作迁移，并核对后打包交付。"
