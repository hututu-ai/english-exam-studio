<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生学案 · __TITLE__</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f3ef;color:#222;font:17px/1.85 -apple-system,BlinkMacSystemFont,Arial,"PingFang SC",sans-serif}.toolbar{padding:20px;background:white;border-bottom:1px solid #ddd}.toolbar h1{font-size:22px;margin:0}.toolbar p{color:#666;font-size:14px}.toolbar button,.toolbar a{display:inline-block;padding:8px 14px;border:1px solid #bbb;border-radius:4px;background:#fff;color:#222;font:inherit;text-decoration:none;margin-right:8px;cursor:pointer}.choices{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:14px}.choices label{white-space:nowrap}main{max-width:950px;margin:25px auto;padding:0 24px}.worksheet{background:white;padding:36px;margin-bottom:28px;border:1px solid #ddd}.worksheet[hidden]{display:none}.worksheet header{border-bottom:2px solid #222;padding-bottom:14px;margin-bottom:25px}.worksheet h2{margin:0;font-size:26px}.worksheet header span{font-size:14px}.reading p{margin:17px 0}.reading h3{margin:18px 0 5px;font-size:20px}.caption{font-size:15px;color:#555;margin:2px 0!important}.blank{white-space:nowrap}.question{margin:25px 0;break-inside:avoid}.options{display:grid;grid-template-columns:1fr 1fr;gap:7px 20px}.answer-space{font-size:14px}.hint{font-size:14px;color:#666}.lines{height:85px;background:repeating-linear-gradient(transparent,transparent 27px,#bbb 28px,transparent 29px)}.writing-space{height:260px;background:repeating-linear-gradient(transparent,transparent 27px,#bbb 28px,transparent 29px)}blockquote{border-left:2px solid #777;margin:16px 0;padding-left:16px}table{width:100%;border-collapse:collapse;font-size:15px}th,td{border:1px solid #aaa;text-align:left;padding:9px;min-width:140px}td{height:48px}img{max-width:100%;height:auto}h3{break-after:avoid}@media(max-width:650px){main{padding:0 12px}.worksheet{padding:20px}.options{grid-template-columns:1fr}}@media print{@page{size:A4;margin:16mm}.toolbar{display:none}body{background:white;font-size:11pt;line-height:1.7}main{max-width:none;margin:0;padding:0}.worksheet{padding:0;border:0;break-before:page;margin:0}.worksheet:first-child{break-before:auto}.worksheet h2{font-size:18pt}.worksheet h3{font-size:13pt}.question{margin:18px 0}.lines,.writing-space{print-color-adjust:exact;-webkit-print-color-adjust:exact}tr{break-inside:avoid}.hint{font-size:10pt}}@media print{.worksheet[data-kind=listening]{break-before:auto;margin-bottom:10mm}.worksheet[data-kind=listening] header{margin:12px 0;padding-bottom:7px}.worksheet[data-kind=listening] h2{font-size:14pt}} </style><div class="toolbar"><h1>学生学案 · __TITLE__</h1><p>选择本节课要用的内容，再打印或保存为 PDF。学案保留题目与练习空间，答案在教师课件中核对。</p><button id="selectAll">全选</button><button id="clearAll">全不选</button><button id="print">打印所选内容</button><a href="index.html">返回教师课件</a><div class="choices">__SECTION_OPTIONS__</div><p id="count"></p></div><main>__WORKSHEET_BODY__</main><script>const boxes=[...document.querySelectorAll('[data-section]')];function update(){boxes.forEach(x=>document.getElementById(x.dataset.section).hidden=!x.checked);document.getElementById('count').textContent='已选 '+boxes.filter(x=>x.checked).length+' 个部分'}boxes.forEach(x=>x.onchange=update);document.getElementById('selectAll').onclick=()=>{boxes.forEach(x=>x.checked=true);update()};document.getElementById('clearAll').onclick=()=>{boxes.forEach(x=>x.checked=false);update()};document.getElementById('print').onclick=()=>{if(boxes.some(x=>x.checked))window.print();else document.getElementById('count').textContent='请先选择至少一个部分。'};if(location.hash&&document.getElementById(location.hash.slice(1))){boxes.forEach(x=>x.checked=x.dataset.section===location.hash.slice(1))}update()</script></html>
