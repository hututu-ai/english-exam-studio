function sourceHTML(s,p){const ranges=[];for(const [i,b] of (s.blanks||[]).entries())if(b.paragraph_id===p.id&&state.dictation.has(s.id))ranges.push({start:b.start,end:b.end,key:`${s.id}-${i}`,kind:'listen'});for(const m of p.text.matchAll(/\{\{(\d+)\}\}/g))ranges.push({start:m.index,end:m.index+m[0].length,key:m[1],kind:'exam'});for(const u of (p.underlines||[])){const i=p.text.indexOf(u);if(i>=0)ranges.push({start:i,end:i+u.length,kind:'underline'})}ranges.push(...paragraphClues(s,p),...v10Ranges(s,p));const mark=state.marks[p.id];if(mark){let start=p.text.indexOf(mark);if(start>=0)ranges.push({start,end:start+mark.length,kind:'mark'})}const boundaries=new Set([0,p.text.length]);for(const r of ranges){boundaries.add(r.start);boundaries.add(r.end)}const pos=[...boundaries].sort((a,b)=>a-b);let html='';for(let i=0;i<pos.length-1;i++){const a=pos[i],b=pos[i+1],gap=ranges.find(r=>!['mark','underline','clue','tmark'].includes(r.kind)&&a>=r.start&&a<r.end),highlight=ranges.some(r=>r.kind==='mark'&&a>=r.start&&b<=r.end);if(gap){if(a!==gap.start)continue;let shown=gap.kind==='listen'?state.gapShown.has(gap.key):state.answers.has(gap.key);let text=gap.kind==='listen'?p.text.slice(gap.start,gap.end):answerText(qmap.get(gap.key).q);html+=`<button class="gap ${shown?'filled':''}" data-action="gap" data-sid="${s.id}" data-key="${gap.key}" data-kind="${gap.kind}" aria-label="${gap.kind==='listen'?'听写空':'第'+gap.key+'题'}">${shown?esc(text):(gap.kind==='listen'?'____':gap.key+' ____')}</button>`;}else{let text=words(p.text.slice(a,b));const tm=ranges.find(r=>r.kind==='tmark'&&a>=r.start&&b<=r.end);if(tm)text=v10MarkHTML(tm,text);text=`<span data-v10-start="${a}">${text}</span>`;if(ranges.some(r=>r.kind==='underline'&&a>=r.start&&b<=r.end))text='<u><b>'+text+'</b></u>';const clue=ranges.find(r=>r.kind==='clue'&&a>=r.start&&b<=r.end);if(clue)text=`<span class="clue clue-${clue.color}" data-clue-index="${clue.index}" title="${esc(clue.label)}">${text}${b===clue.end?`<sup>${clue.index+1}</sup>`:''}</span>`;html+=highlight?`<mark>${text}</mark>`:text}}return html}
function hasHiddenBlanks(s,p){return state.dictation.has(s.id)&&(s.blanks||[]).some((b,i)=>b.paragraph_id===p.id&&!state.gapShown.has(`${s.id}-${i}`))}
function paragraphHTML(s,p,index){if(p.role==='heading'||p.heading)return `<h3 id="${p.id}" class="article-heading">${words(p.text)}</h3>`;if(p.role==='caption')return `<div id="${p.id}" class="article-caption">${words(p.text)}</div>`;index=s.paragraphs.filter(x=>!x.heading&&!['heading','caption'].includes(x.role)).findIndex(x=>x.id===p.id);let canTranslate=!!p.translation;return `<div class="paragraph" id="${p.id}" data-sid="${s.id}"><div class="ptext"><span class="pnum">${index+1}</span>${p.speaker?`<b class="speaker">${esc(p.speaker)}:</b>`:''}<span class="source-text">${sourceHTML(s,p)}</span></div><div class="pimage">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.alt||'原卷图示')}" style="max-width:100%;height:auto;margin:12px 0">`:""}</div><div class="pactions">${canTranslate?`<button class="small quiet" data-action="translate" data-pid="${p.id}" data-sid="${s.id}">${state.translations.has(p.id)?'收起本段译文':'本段中译'}</button>`:''}${p.audio_start!==undefined?`<button class="small quiet" data-action="paragraphReplay" data-pid="${p.id}" data-sid="${s.id}" aria-label="重听这一段" title="重听这一段">▶</button>`:s.kind!=='listening'?`<button class="small quiet" data-action="read" data-pid="${p.id}" data-sid="${s.id}">▶ 朗读</button>`:''}</div><div class="translation" ${state.translations.has(p.id)?'':'hidden'}>${hasHiddenBlanks(s,p)?'先揭示本段听写空，再展开中文对照。':esc(p.translation)}</div></div>`}
function analysisHTML(s,q){const tab=ui.analysisTabs[q.id]||'steps',tabs=[['steps','解题三步'],...(Object.keys(q.distractors||{}).length?[['options','选项辨析']]:[]),['transfer','方法迁移']],ev=(q.evidence||[]).map((e,i)=>`${i>0?`<button class="small" data-action="evidence" data-qid="${q.id}" data-index="${i}">定位依据 ${i+1}</button>`:''}${e.start!==undefined?`<button class="small" data-action="replay" data-qid="${q.id}" data-index="${i}">▶ 重听关键句</button>`:''}`).join('');return `<div class="analysis-heading"><strong class="answer">答案 ${esc(Object.keys(q.options||{}).length?(Array.isArray(q.answer)?q.answer.join(' / '):q.answer):answerText(q))}</strong><span class="type-badge">${esc(q.question_type)}</span></div><div class="analysis-tabs" role="tablist" aria-label="第${q.id}题解析内容">${tabs.map(([id,label])=>`<button role="tab" id="at-${q.id}-${id}" data-action="analysisTab" data-qid="${q.id}" data-tab="${id}" aria-controls="ap-${q.id}-${id}" aria-selected="${tab===id}">${label}</button>`).join('')}</div><div class="analysis-panel" id="ap-${q.id}-steps" role="tabpanel" aria-labelledby="at-${q.id}-steps" ${tab==='steps'?'':'hidden'}><p class="type-note">${esc(q.type_note)}</p><ol class="solve-steps">${(q.solve_steps||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ol><details class="answer-evidence"><summary>核对答案依据</summary><p>${esc(q.analysis)}</p><p class="muted answer-provenance">${esc(q.answer_source)}</p></details>${ev?`<div class="evidence-row">${ev}</div>`:''}</div><div class="analysis-panel" id="ap-${q.id}-options" role="tabpanel" aria-labelledby="at-${q.id}-options" ${tab==='options'?'':'hidden'}>${reasonHTML(q)}</div><div class="analysis-panel" id="ap-${q.id}-transfer" role="tabpanel" aria-labelledby="at-${q.id}-transfer" ${tab==='transfer'?'':'hidden'}><p>${esc(q.strategy)}</p>${q.pitfall?`<p class="pitfall"><b>易错提醒：</b>${esc(q.pitfall)}</p>`:''}${q.knowledge?`<details class="knowledge-card"><summary>${esc(q.knowledge.title)} · 知识与迁移</summary><p>${esc(q.knowledge.rule)}</p><blockquote>${words(q.knowledge.example)}</blockquote><p>${esc(q.knowledge.explanation)}</p></details>`:''}</div>`}
function questionHTML(s,q){const canShow=s.kind!=='listening'||!state.dictation.has(s.id),shown=ui.openAnswers.includes(q.id)&&canShow,chosen=state.choices[q.id],ans=Array.isArray(q.answer)?q.answer:[q.answer],filled=state.answers.has(q.id)&&canShow,feedback=ui.feedback[q.id];return `<article class="qcard ${activeQuestion(s)===q.id?'current-q':''}" ${ui.focus&&activeQuestion(s)!==q.id?'hidden':''} id="q-${q.id}" data-qid="${q.id}"><div class="qtop"><span class="qnum">${esc(q.id)}</span><div class="stem">${words(q.stem)}</div></div>${optionRowsHTML(s,q,filled)}${s.kind==='listening'&&q.audio?questionAudioHTML(s,q):''}${s.kind==='grammar'?`<details class="teacher-answer-record" ${feedback!==undefined?'open':''}><summary>记录学生答案 · 讲评用</summary><form class="answer-input" data-qid="${q.id}"><input aria-label="第${q.id}题学生答案示例" autocomplete="off" value="${esc(ui.inputs[q.id]||'')}" placeholder="录入课堂中需要讲评的答案"><button type="submit">对照</button></form><p class="input-feedback ${feedback===true?'right':feedback===false?'wrong':''}" role="status">${feedback===true?'与参考答案匹配，已回填原文。':feedback===false?'与参考答案不同，可展开解析讲评词形与句法；其他合理表达由教师判断。':''}</p></details>`:''}${s.kind==='writing'?writingHTML(s,q):`<div class="qtools"><button class="primary" data-action="answer" data-qid="${q.id}">${shown?'收起解析':'答案与解析'}</button><button data-action="locateQ" data-qid="${q.id}">定位原文</button>${q.logic_links?.length?`<button data-action="showClues" data-qid="${q.id}" aria-pressed="${ui.clues[s.id]===q.id}">${ui.clues[s.id]===q.id?'收起线索':'显示线索'}</button>`:''}<button class="quiet" data-action="bookmark" data-qid="${q.id}" aria-pressed="${bookmarks.has(q.id)}">${bookmarks.has(q.id)?'★ 待复讲':'☆ 待复讲'}</button></div>${clueLegend(q)}<div class="analysis" ${shown?'':'hidden'}>${analysisHTML(s,q)}</div>`}<details class="teacher-note"><summary>课堂批注</summary><textarea data-note="${q.id}" aria-label="第${q.id}题课堂批注" placeholder="记录学生易错点或下次追问">${esc(ui.notes[q.id]||'')}</textarea></details></article>`}
function activeQuestion(s){return currentQuestions[s.id]||s.questions[0].id}
function questionSetHTML(s){const ids=[...qmap.keys()],i=ids.indexOf(activeQuestion(s));return `<div class="question-nav"><div class="question-numbers">${s.questions.map(q=>`<button data-action="selectQuestion" data-sid="${s.id}" data-qid="${q.id}" aria-current="${activeQuestion(s)===q.id?'true':'false'}" title="第${q.id}题">${q.id}</button>`).join('')}</div>${s.questions.length>1?`<div class="question-display" role="group" aria-label="题目显示范围"><button data-action="questionDisplay" data-focus="true" aria-pressed="${ui.focus}">逐题看</button><button data-action="questionDisplay" data-focus="false" aria-pressed="${!ui.focus}">全部题目</button></div>`:''}</div>`+s.questions.map(q=>questionHTML(s,q)).join('')+`<div class="question-next"><button data-action="prevQ" data-qid="${activeQuestion(s)}" ${i===0?'disabled':''}>← 上一题</button><button data-action="nextQ" data-qid="${activeQuestion(s)}" ${i===ids.length-1?'disabled':''}>下一题 →</button></div>`}
function sourceMarkup(s){if(s.source_groups)return s.source_groups.map(g=>`<div class="article-unit">${g.paragraph_ids.map(id=>paragraphHTML(s,s.paragraphs.find(p=>p.id===id),0)).join('')}</div>`).join('');return s.paragraphs.map((p,i)=>paragraphHTML(s,p,i)).join('')}
function selectQuestion(qid,scroll=false){const z=qmap.get(qid);if(!z)return;currentQuestions[z.s.id]=qid;activateSection(z.s.id,false);if(z.s.kind!=='listening'&&(ui.layout[z.s.id]||'split')!=='split')setReadingMode(z.s.id,'split');renderQuestions(z.s);if(scroll)scrollToEl(document.getElementById('q-'+qid))}
function renderSource(s){const el=document.getElementById('source-'+s.id),pane=el.closest('.pane-scroll'),top=pane?.scrollTop||0;el.innerHTML=sourceMarkup(s);if(pane)pane.scrollTop=top;const clear=document.querySelector('#section-'+s.id+' '+(s.kind==='listening'?'.transcript-tools':'.reader-head')+' [data-action=clearMarks]');if(clear)clear.hidden=!s.paragraphs.some(p=>state.marks[p.id]);scheduleInk()}
function renderQuestions(s){const el=document.getElementById('questions-'+s.id),pane=el.closest('.pane-scroll')||el,top=pane.scrollTop,players=new Map([...el.querySelectorAll('audio[data-q-audio]')].map(a=>[a.dataset.qAudio,a]));el.innerHTML=questionSetHTML(s);el.querySelectorAll('audio[data-q-audio]').forEach(a=>{if(players.has(a.dataset.qAudio))a.replaceWith(players.get(a.dataset.qAudio))});pane.scrollTop=top;updateShared(s);scheduleInk()}
function sectionMenu(s){return `<details class="more-menu"><summary aria-label="本节更多操作" title="更多">⋯</summary><div class="menu-content">${s.kind==='listening'?`<label><input class="loop" data-audio="audio-${s.id}" type="checkbox">整段循环</label><label>证据复听 <select class="repeat-times" aria-label="证据复听次数"><option value="1">1次</option><option value="2" selected>2次</option><option value="3">3次</option></select></label><label><input class="follow-audio" data-sid="${s.id}" type="checkbox">跟随原音定位</label><button data-action="fullRecording">完整录音</button>`:''}${['seven','cloze','grammar'].includes(s.kind)?`<button data-action="fillPassage" data-sid="${s.id}">回填全文答案（通读）</button><button data-action="unfillPassage" data-sid="${s.id}">恢复原文空格</button>`:''}<button data-action="reset" data-sid="${s.id}">重置本节</button></div></details>`}
function listenSection(s){const first=s.questions[0].id,last=s.questions.at(-1).id;return `<section class="section listening-view" id="section-${s.id}" data-section="${s.id}" data-script="false"><div class="section-head"><h2>${esc(s.title)} <span>第 ${first}${first!==last?'–'+last:''} 题</span></h2><div class="listen-player"><span class="audio-scope">整段</span><audio id="audio-${s.id}" preload="metadata" src="${esc(s.audio)}"></audio><button class="listen-play" data-action="playListening" data-sid="${s.id}" title="播放 / 暂停整段 · 空格键" aria-label="播放 ${esc(s.title)}" aria-pressed="false">▶</button><input class="listen-seek" type="range" min="0" max="${s.audio_duration||100}" step="0.1" value="0" data-audio="audio-${s.id}" aria-label="${esc(s.title)}播放进度"><span class="playback-time" id="time-${s.id}">0:00 / ${formatTime(s.audio_duration||0)}</span><select class="speed" data-audio="audio-${s.id}" aria-label="${esc(s.title)}播放速度">${[.5,.75,1,1.25,1.5].map(n=>`<option value="${n}" ${n===1?'selected':''}>${n}×</option>`).join('')}</select><button class="quiet small" data-action="vocabulary" data-sid="${s.id}">词句</button>${sectionMenu(s)}</div></div><div class="body"><div class="listen-content"><div id="questions-${s.id}" class="listen-questions pane-scroll ${s.questions.length>1?'multi':''}">${questionSetHTML(s)}</div><details class="listen-transcript" id="transcript-${s.id}" data-script-sid="${s.id}"><summary><span>原文与精听</span><small class="script-disclosure">展开</small></summary><div class="transcript-scroll pane-scroll"><div class="transcript-tools"><label><input class="listening-gaps" data-sid="${s.id}" type="checkbox">关键表达挖空</label><button data-action="clearMarks" data-sid="${s.id}" class="quiet small" hidden>清除定位</button></div><div class="dictation-tools" hidden><span class="dictation-focus">${esc(s.listening_focus||'听出答案线索与关键表达')}</span><div class="blank-actions"><button data-action="nextBlank" data-sid="${s.id}">揭示下一空</button><button data-action="allBlanks" data-sid="${s.id}">全部揭示</button><button class="quiet" data-action="resetBlanks" data-sid="${s.id}">重新遮盖</button></div></div><div id="source-${s.id}">${sourceMarkup(s)}</div></div></details></div></div></section>`}
function sectionHTML(s){if(s.kind==='listening')return listenSection(s);const application=s.writing_genre==='application',mode=application?'split':(['split','deep','writing'].includes(ui.layout[s.id])?ui.layout[s.id]:'split'),wide=!!ui.readerWide?.[s.id];return `<section class="section reading-view ${application?'application-view':''}" id="section-${s.id}" data-section="${s.id}" data-layout="${mode}" data-reader-wide="${wide}"><div class="section-head"><h2>${esc(s.title)} <span>${s.questions.length} ${s.kind==='writing'?'项写作':'题'}</span></h2><div class="section-tools"><button data-action="vocabulary" data-sid="${s.id}">词句</button>${s.origin?`<button data-action="origin" data-sid="${s.id}">原卷</button>`:''}${sectionMenu(s)}</div></div><div class="body workspace-main"><div class="source-column"><div class="reader-head"><span>${s.kind==='writing'?'原卷任务与材料':'阅读原文'}</span><div class="reader-actions"><button data-action="clearMarks" data-sid="${s.id}" class="quiet small" ${Object.keys(state.marks).some(id=>s.paragraphs.some(p=>p.id===id))?'':'hidden'}>清除定位</button><button data-action="readerWidth" data-sid="${s.id}" class="quiet small" aria-expanded="${wide}" title="暂时收起右栏，原文位置与已展开译文保持不变">${wide?'恢复左右栏':'展开原文'}</button></div></div><div class="source-pane pane-scroll" id="source-pane-${s.id}"><div id="source-${s.id}">${sourceMarkup(s)}</div></div></div><div class="lesson-side" ${wide?'hidden':''}><div class="teaching-tabs" role="tablist" aria-label="本篇教学内容">${(application?[['split','写作讲评']]:[['split','题目讲评'],['deep','篇章精读'],['writing','写作迁移']]).map(([id,t])=>`<button id="teaching-${s.id}-${id}" role="tab" data-action="readingMode" data-sid="${s.id}" data-mode="${id}" aria-controls="${id==='split'?'question':'deep'}-pane-${s.id}" aria-selected="${mode===id}">${t}</button>`).join('')}</div><div class="question-pane pane-scroll" id="question-pane-${s.id}" role="tabpanel" aria-labelledby="teaching-${s.id}-split" ${mode!=='split'?'hidden':''}>${s.shared_options?`<details class="shared-options">${sharedOptionsHTML(s)}</details>`:''}<div id="questions-${s.id}">${questionSetHTML(s)}</div></div><div class="deep-pane pane-scroll" id="deep-pane-${s.id}" role="tabpanel" aria-labelledby="teaching-${s.id}-${mode==='writing'?'writing':'deep'}" ${mode==='split'?'hidden':''}>${deepHTML(s)}</div></div></div></section>`}
function formatTime(n){n=Math.floor(n||0);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function setListeningMode(sid,mode){setListeningGaps(sid,mode==='dictation');setListeningScript(sid,mode!=='questions')}
function activateSection(sid,scroll=true){if(!sections.has(sid))return;const changed=state.active!==sid;if(changed){if(window.inkReady)closeInk();$('#returnQuestion').hidden=true;$$('audio').forEach(a=>a.pause());speechSynthesis.cancel();rangeEnd=null;rangeAudio=null}state.active=sid;$$('[data-section]').forEach(el=>el.hidden=el.dataset.section!==sid);$$('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===sid);a.setAttribute('aria-current',a.dataset.nav===sid?'page':'false')});setNav(false);let index=D.sections.findIndex(s=>s.id===sid);$('#chapterPager').innerHTML=`<button data-action="chapterPrev" ${index===0?'disabled':''}>← ${index>0?esc(D.sections[index-1].title):'上一节'}</button><span>${index+1} / ${D.sections.length} 章节</span><button data-action="chapterNext" ${index===D.sections.length-1?'disabled':''}>${index<D.sections.length-1?esc(D.sections[index+1].title):'下一节'} →</button>`;if(location.hash!=='#section-'+sid)history.replaceState(null,'','#section-'+sid);if(scroll)window.scrollTo({top:0,behavior:'instant'})}

function scrollToEl(el){if(!el)return;let id=el.id;if(id?.startsWith('q-')){const qid=id.slice(2),z=qmap.get(qid);if(z){currentQuestions[z.s.id]=qid;activateSection(z.s.id,false);if(z.s.kind!=='listening')setReadingMode(z.s.id,'split');renderQuestions(z.s);el=document.getElementById(id)}}const section=el.closest('[data-section]');if(section){activateSection(section.dataset.section,false);if(section.classList.contains('listening-view')&&el.closest('.listen-transcript'))setListeningScript(section.dataset.section,true);el=document.getElementById(id)||el}const pane=el.closest('.pane-scroll')||el.closest('.listen-transcript,.listen-questions');if(pane&&getComputedStyle(pane).overflowY==='auto'){pane.scrollTo({top:Math.max(0,pane.scrollTop+el.getBoundingClientRect().top-pane.getBoundingClientRect().top-(id?.startsWith('q-')?(pane.querySelector('.question-nav')?.getBoundingClientRect().height||90)+18:20)),behavior:'instant'})}else el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('reading-focus')}

function v10Count(s,term){const escaped=String(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.paragraphs.reduce((n,p)=>n+(p.text.match(new RegExp('\\b'+escaped+'\\b','gi'))||[]).length,0)}

</script></body></html>
