name: Cross-platform skill checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py examples/demo-reading.json output/demo --source-ledger examples/source-ledger.json
      - run: python scripts/verify_output.py output/demo
